[project]
name = "microscope-toolset"
version = "0.1.0"
description = "Microscope Toolset for napari"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dario Bassi", email = "dario.bassi111@gmail.com" }]
dependencies = [
    # Viewer & microscope control
    "napari>=0.7.0",
    "napari-plugin-engine>=0.2.1",
    "napari-micromanager>=0.3.0",
    "PyQt6>=6.11.0",
    "pymmcore-plus>=0.18.1",
    "useq-schema>=0.9.2",
    # MCP server
    "mcp>=1.27.0",
    "uvicorn>=0.46.0",
    "anyio>=4.13.0",
    # Image processing
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "scikit-image>=0.26.0",
    "opencv-python>=4.13.0.92",
    "Pillow>=12.2.0",
    "tifffile>=2026.4.11",
    "imageio>=2.37.3",
    "numba>=0.65.0",
    # AI / ML
    "torch>=2.11.0",
    "cellpose>=4.1.1",
    "transformers>=5.6.1",
    "openai>=2.32.0",
    # Database / search
    "elasticsearch>=9.3.0",
    "pgvector>=0.4.2",
    # Utilities
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    # Simulation
    "virtual-microscope>=0.1.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/microscope_toolset"]

[project.entry-points."napari.manifest"]
"microscope-toolset" = "microscope_toolset:napari.yaml"