[project]
name = "microscope-toolset"
version = "0.1.0"
description = "Microscope Toolset for napari"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Dario Bassi", email = "dario.bassi111@gmail.com" }]
dependencies = [
    # Viewer & microscope control
    "napari>=0.7.0",
    "napari-plugin-engine>=0.2.1",
    "napari-micromanager>=0.3.0",
    "PyQt6>=6.11.0",
    "pymmcore-plus>=0.18.1",
    "pymmcore-proxy>=0.1.0",
    "useq-schema>=0.9.2",
    # MCP server
    "mcp>=1.27.0",
    "uvicorn>=0.46.0",
    "anyio>=4.13.0",
    # Image processing
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "scikit-image>=0.26.0",
    "opencv-python>=4.13.0.92",
    "Pillow>=12.2.0",
    "tifffile>=2026.4.11",
    "imageio>=2.37.3",
    "numba>=0.65.0",
    # AI / ML
    "torch>=2.11.0",
    "cellpose>=4.1.1",
    "transformers>=5.6.1",
    "sentence-transformers>=2.2.0",
    "anthropic>=0.30.0",
    "openai>=2.32.0",
    # Database / search
    "elasticsearch>=9.3.0",
    "pgvector>=0.4.2",
    "psycopg2-binary>=2.9.0",
    # Document processing
    "pymupdf>=1.23.0",
    "pymupdf4llm>=0.0.5",
    "semantic-text-splitter>=0.10.0",
    "tiktoken>=0.5.0",
    "pdf2image>=1.16.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
    "chardet>=5.0.0",
    # Utilities
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "more-itertools>=10.0.0",
    "protobuf>=4.23.0",
    "griffe>=0.30.0",
    "pygame>=2.5.0",
    # Simulation
    "virtual-microscope>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    "pre-commit>=3.0",
    "vulture>=2.7",
    "coverage>=7.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."napari.manifest"]
"microscope-toolset" = "microscope_toolset:napari.yaml"

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
# With uv, run:
#   uv sync              — install all dependencies from this file
#   uv sync --extra dev  — include dev tools (pytest, pre-commit, …)
#
# The two packages below are not on PyPI and must be resolved from git or
# from local clones.  Choose ONE approach per package:
#
#   Git (default — works for any user, no local clone needed):
#       virtual-microscope = { git = "https://github.com/hinderling/virtual-microscope" }
#       pymmcore-proxy     = { git = "https://github.com/hinderling/pymmcore-proxy.git" }
#
#   Local clone (faster, editable — use when you have the folder in the repo root):
#       virtual-microscope = { path = "./virtual-microscope", editable = true }
#       pymmcore-proxy     = { path = "./pymmcore-proxy",     editable = true }
#
# Uncomment the block that matches your setup:

[tool.uv.sources]
virtual-microscope = { git = "https://github.com/hinderling/virtual-microscope" }
pymmcore-proxy     = { git = "https://github.com/hinderling/pymmcore-proxy.git" }

# Local-clone alternative (comment out the git lines above and uncomment these):
# virtual-microscope = { path = "./virtual-microscope", editable = true }
# pymmcore-proxy     = { path = "./pymmcore-proxy",     editable = true }

# PyTorch + CUDA: uncomment and set your CUDA version (cu118, cu121, cu124, …).
# Without this uv installs the CPU-only build.
# [tool.uv.sources]
# torch = { index = "https://download.pytorch.org/whl/cu121" }

# ---------------------------------------------------------------------------
# ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
# Exclude cloned external packages and generated/archived folders
exclude = [
    "virtual-microscope",
    "napari-micromanager",
    "pymmcore-proxy",
    "pymmcore-widgets",
    "scratch",
    "benchmark_logs",
    "src/benchmarking/experiments",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (likely bugs and design issues)
    "C4",  # flake8-comprehensions (simplify comprehensions)
]
ignore = [
    "E501",  # line too long — enforced by ruff-format instead
    "N802",  # function name should be lowercase — Qt slots use camelCase
    "N803",  # argument name should be lowercase — Qt signal args
    "N806",  # variable in function should be lowercase — Qt conventions
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"src/self_learn/__init__.py" = ["F401"]
"src/self_learn/analysis/__init__.py" = ["F401"]
"src/self_learn/detection/__init__.py" = ["F401"]
"src/self_learn/hardware/__init__.py" = ["F401"]
"src/self_learn/utils/__init__.py" = ["F401"]
"src/self_learn/workflows/__init__.py" = ["F401"]
"src/benchmarking/tests/*/initialize_test.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# bandit — security linting
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths  = ["test"]

[tool.bandit]
# B101  assert used — fine in tests and guards
# B404  import subprocess — required for launching ES/PG/proxy processes
# B603  subprocess with list args — used to open workspace folder in Explorer
# B607  partial executable path — we call "explorer", "open", "xdg-open" by name
# B110  try/except/pass — used throughout for graceful degradation of optional features
# B112  try/except/continue — same rationale as B110
# B608  SQL f-strings in log_db.py use internal collection_name identifiers, not user input
skips = ["B101", "B404", "B603", "B607", "B110", "B112", "B608"]
