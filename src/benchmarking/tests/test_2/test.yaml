title: "Large-area scanning — DAPI + mScarlet, 3500 cells, 6000x6000 µm"
description: |
  Large-area scanning scenario. Simulation area: 6000x6000 µm (provides ~500 µm
  margin on each side for a 5000x5000 µm scanning run). 3500 normal cells,
  nearly static (brownian_d reduced from the default 60.0 to 2.0).
  Continuous simulation, in focus from the start.

backend: particle
cell_type: normal
n_cells: 3500
seed: 42
width: 6000
height: 6000
brownian_d: 2.0
focal_plane: 0.0

channels:
  - name: DAPI
    filter: "SCFP2(434/474)"
    led: UV
  - name: mScarlet
    filter: "mScarlet3(569/582)"
    led: ORANGE
